# Требуется Linux shell runner с Docker Compose, TUN и SCTP.
# Один e2e job владеет стендом целиком: контейнеры не теряются между runner jobs.

stages:
  - validate
  - e2e

variables:
  IMSI: "999700000000001"
  COMPOSE_PROJECT_NAME: "open5gs-lab"
  DOCKER_BUILDKIT: "1"

default:
  tags: [docker, linux]
  interruptible: true

validate-config:
  stage: validate
  script:
    - python3 -m pip install --user -r tests/requirements.txt
    - python3 scripts/validate-configs.py
    - docker compose config --quiet
    - python3 -m compileall -q tests scripts
    - python3 -m pytest -c tests/pytest.ini --collect-only -q tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

e2e:
  stage: e2e
  script:
    - ./scripts/preflight.sh
    - docker compose build --pull
    - SKIP_BUILD=1 ./scripts/up.sh
    - ./scripts/test.sh -m "not slow"
  after_script:
    - mkdir -p reports/logs
    - for c in amf smf upf nrf gnb ue; do docker compose logs --no-color "$c" > "reports/logs/$c.log" 2>&1 || true; done
    - docker compose ps --all > reports/logs/containers.txt 2>&1 || true
    - ./scripts/down.sh --purge || true
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml
    paths:
      - reports/
    expire_in: 1 month
