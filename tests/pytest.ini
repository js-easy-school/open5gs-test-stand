[pytest]
testpaths = .
addopts = -ra --strict-markers
markers =
    infra: состояние стенда и сетевых функций
    subscriber: данные абонента в базе
    registration: регистрация абонента и сессия передачи данных
    negative: негативные сценарии и отказ зависимостей
    slow: длительные проверки, в быстром прогоне пропускаются
