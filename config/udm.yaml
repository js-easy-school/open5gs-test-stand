# UDM — управление данными абонента: выдаёт профиль и векторы аутентификации.
logger:
  level: info

global:
  max:
    ue: 128

udm:
  hnet:
    - id: 1
      scheme: 1
      key: /opt/open5gs/etc/open5gs/hnet/curve25519-1.key
    - id: 2
      scheme: 2
      key: /opt/open5gs/etc/open5gs/hnet/secp256r1-2.key
  sbi:
    server:
      - address: 10.33.0.13
        port: 7777
    client:
      scp:
        - uri: http://10.33.0.11:7777
