# NRF — реестр сетевых функций. Поднимается первым: остальные NF при старте
# регистрируются здесь, и через него же находят друг друга.
logger:
  level: info

global:
  max:
    ue: 128

db_uri: mongodb://mongo/open5gs

nrf:
  serving:
    - plmn_id:
        mcc: 999
        mnc: 70
  sbi:
    server:
      - address: 0.0.0.0
        port: 7777
