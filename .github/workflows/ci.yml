name: 5G core lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open5gs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test and validation dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Validate topology and configuration
        run: python scripts/validate-configs.py
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Compile test suite
        run: python -m compileall -q tests
      - name: Collect all pytest and Gherkin scenarios
        run: python -m pytest -c tests/pytest.ini --collect-only -q tests

  e2e:
    name: Registration and user plane
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable TUN and SCTP in the runner kernel
        run: |
          sudo modprobe tun || true
          if ! sudo modprobe sctp; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe sctp
          fi
          if [ ! -c /dev/net/tun ]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
            sudo chmod 666 /dev/net/tun
          fi
          test -c /dev/net/tun
          test -r /proc/net/sctp/assocs

      - name: Show runner capacity
        run: |
          uname -a
          docker --version
          docker compose version
          free -h
          df -h /

      - name: Build pinned images
        run: docker compose build --progress plain

      - name: Deploy the lab and register the UE
        env:
          SKIP_BUILD: "1"
          WAIT_SECONDS: "240"
        run: ./scripts/up.sh

      - name: Run pytest and executable Gherkin scenarios
        run: ./scripts/test.sh -m "not slow"

      - name: Capture diagnostic evidence
        if: always()
        run: |
          mkdir -p reports/logs
          docker compose ps --all > reports/logs/containers.txt 2>&1 || true
          for service in nrf scp amf smf upf ausf udm udr pcf bsf nssf gnb ue; do
            docker compose logs --no-color "$service" > "reports/logs/$service.log" 2>&1 || true
          done
          docker exec o5g-ue nr-cli imsi-999700000000001 -e status > reports/logs/ue-status.txt 2>&1 || true

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open5gs-test-evidence
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down the lab
        if: always()
        run: ./scripts/down.sh --purge
